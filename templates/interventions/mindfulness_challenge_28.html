{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindfulness - Challenge 27: Learning</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 2rem; margin-bottom: 1.5rem; }
        h1 { margin: 0 0 0.5rem 0; font-weight: 300; color: #333; }
        h2 { margin: 0 0 1rem 0; font-weight: 600; color: #333; }
        p { color: #444; }
        .actions { margin-top: 1.25rem; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; border: none; cursor: pointer; }
        .video-container { margin: 2rem 0; text-align: center; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 800px; margin: 0 auto; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 12px; }
        .mindfulness-info { background: #f8f9fa; border-left: 4px solid #667eea; padding: 1.5rem; margin: 1.5rem 0; border-radius: 0 12px 12px 0; }
        .mindfulness-info h3 { margin: 0 0 1rem 0; color: #333; }
        .mindfulness-info p { margin: 0.5rem 0; color: #666; }
        .challenge-title-svg { max-width: 100%; height: auto; display: block; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <img class="challenge-title-svg" src="{% static 'design/intervention/Challenge 28_ Learning.svg' %}" alt="Challenge 27: Learning">
            <!-- <h2>Mindfulness: Introduction</h2> -->
            
            <div class="video-container">
                <div class="video-wrapper">
                    <iframe src="https://player.vimeo.com/video/926657672?title=0&byline=0&portrait=0"
                            frameborder="0"
                            allow="autoplay; fullscreen; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
            </div>
            
            <div class="actions">
                <a class="btn" href="{% url 'intervention_access' %}" style="text-decoration: none;">Back to Intervention Access</a>
            </div>
        </div>
    </div>
</body>
</html>
