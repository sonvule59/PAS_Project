<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confident Moves - Home</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <style>
        body { margin: 0; background: #ebe4db; }
        .page { width: 100%; overflow: hidden; }
        .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
        img { max-width: 100%; display: block; height: auto; }
        .top-nav { padding-top: 28px; display: flex; justify-content: space-between; align-items: center; }
        .logo-link { display: inline-block; width: 182px; }
        .login-link { display: inline-block; width: 116px; }
        .hero { padding-top: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 24px; align-items: center; }
        .hero-copy { max-width: 660px; }
        .hero-title { width: 636px; max-width: 100%; }
        .hero-subtitle { width: 599px; max-width: 100%; margin-top: 8px; }
        .journey-link { display: inline-block; width: 260px; margin-top: 16px; }
        .hero-image { width: 392px; max-width: 100%; justify-self: center; }
        .journey { padding-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .journey-title { width: 374px; max-width: 100%; }
        .journey-graphic { width: 971px; max-width: 100%; }
        .expect { margin-top: 18px; background: #93a287; padding: 34px 0 36px; }
        .expect-title { width: 238px; margin: 0 auto 18px; max-width: 100%; }
        .expect-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start; }
        .expect-grid img { width: 100%; max-width: 313px; margin: 0 auto; }
        .audience { position: relative; padding: 26px 0 0; min-height: 292px; }
        .audience-title { width: 240px; max-width: 100%; margin-bottom: 14px; }
        .audience-copy { width: 1033px; max-width: 100%; position: relative; z-index: 2; }
        .bottom-wave { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; min-width: 1200px; z-index: 1; }
        @media (max-width: 980px) {
            .hero { grid-template-columns: 1fr; }
            .hero-image { justify-self: start; }
            .expect-grid { grid-template-columns: 1fr; }
            .audience { min-height: 360px; }
            .bottom-wave { min-width: 980px; }
        }
        @media (max-width: 620px) {
            .container { padding: 0 16px; }
            .logo-link { width: 152px; }
            .login-link { width: 102px; }
            .journey-link { width: 220px; }
            .bottom-wave { min-width: 760px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="container">
            <div class="top-nav">
                <a href="{% url 'landing' %}" class="logo-link" aria-label="Confident Moves home">
                    <img src="{% static 'design/landing/landing_logo.svg' %}" alt="Confident Moves">
                </a>
                <a href="{% url 'login' %}" class="login-link" aria-label="Login">
                    <img src="{% static 'design/landing/landing_login.svg' %}" alt="Login">
                </a>
            </div>
            <section class="hero">
                <div class="hero-copy">
                    <img class="hero-title" src="{% static 'design/landing/landing_hero_title.svg' %}" alt="Build Your Confidence. Own Your Movement.">
                    <img class="hero-subtitle" src="{% static 'design/landing/landing_hero_subtitle.svg' %}" alt="A guided journey to be healthy and feel better, designed to help you build sustainable physical activity.">
                    <a href="{% url 'create_account' %}" class="journey-link" aria-label="Start your journey">
                        <img src="{% static 'design/landing/landing_cta_start.svg' %}" alt="Start Your Journey">
                    </a>
                </div>
                <img class="hero-image" src="{% static 'design/landing/landing_hero_image.svg' %}" alt="Person exercising">
            </section>
            <section class="journey">
                <img class="journey-title" src="{% static 'design/landing/landing_journey_title.svg' %}" alt="Your Path to the Journey">
                <img class="journey-graphic" src="{% static 'design/landing/landing_journey_graphic.svg' %}" alt="Journey steps">
            </section>
        </div>
        <section class="expect">
            <div class="container">
                <img class="expect-title" src="{% static 'design/landing/landing_expect_title.svg' %}" alt="What to Expect">
                <div class="expect-grid">
                    <img src="{% static 'design/landing/landing_card_journey.svg' %}" alt="Confident Moves Journey card">
                    <img src="{% static 'design/landing/landing_card_research.svg' %}" alt="Research Based Challenges card">
                    <img src="{% static 'design/landing/landing_card_progress.svg' %}" alt="Track Your Progress card">
                </div>
            </div>
        </section>
        <section class="audience">
            <div class="container">
                <img class="audience-title" src="{% static 'design/landing/landing_audience_title.svg' %}" alt="Who is this for?">
                <img class="audience-copy" src="{% static 'design/landing/landing_audience_body.svg' %}" alt="Confident Moves Intervention is an online behavioral intervention specifically designed to promote physical activity in adults with obesity by providing capability-enhancing learning opportunities.">
            </div>
            <img class="bottom-wave" src="{% static 'design/landing/landing_bottom_wave.svg' %}" alt="" aria-hidden="true">
        </section>
    </main>
</body>
