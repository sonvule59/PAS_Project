{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Confident Moves - Create Account</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { margin: 0; background: #2d2f3c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #f5f5f5; }
        .page { min-height: 100vh; position: relative; overflow: hidden; }
        .container { max-width: 1180px; margin: 0 auto; padding: 24px; position: relative; z-index: 2; }
        img { max-width: 100%; display: block; height: auto; }
        .logo { width: 181px; margin-bottom: 20px; }
        .logo img { position: relative; top: -30px; }
        .layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 28px; align-items: start; }
        .form-shell {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 24px;
            backdrop-filter: blur(2px);
        }
        .title-text {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 18px;
            line-height: 1.2;
        }
        .form-group { margin-bottom: 14px; }
        .label-svg { height: 18px; width: auto; max-width: 100%; margin-bottom: 6px; }
        .field {
            width: 100%;
            height: 42px;
            padding: 10px 12px;
            border: 2px solid #919e84;
            border-radius: 6px;
            background: #fff;
            color: #2d2f3c;
            box-sizing: border-box;
            font-size: 15px;
        }
        .field:focus { outline: none; border-color: #b57957; box-shadow: 0 0 0 3px rgba(181, 121, 87, 0.25); }
        .section-label { width: 316px; max-width: 100%; margin: 10px 0 8px; }
        .plain-label { display: block; margin-bottom: 6px; font-size: 16px; font-weight: 600; color: #e5e7eb; }
        .plain-label-note { display: block; font-size: 16px; font-weight: 400; margin-top: 2px; }
        .actions { margin-top: 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .submit-btn { border: 0; background: transparent; padding: 0; cursor: pointer; width: 105px; }
        .submit-btn img { width: 105px; }
        .login-link { color: #d0d8c7; text-decoration: underline; font-size: 14px; }
        #create-account-output { margin-top: 12px; }
        .alert { padding: 0.75rem 0.9rem; border-radius: 8px; margin-bottom: 0.8rem; }
        .alert-success { background: #e8f5e8; color: #1f6f2f; }
        .alert-error { background: #ffebee; color: #8d1a1a; }
        .alert-info { background: #e3f2fd; color: #114a81; }
        .hero-img { width: 469px; max-width: 100%; justify-self: center; }
        .bottom-wave { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; min-width: 1200px; z-index: 1; pointer-events: none; }
        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
            .hero-img { justify-self: start; width: 360px; }
        }
        @media (max-width: 640px) {
            .container { padding: 16px; }
            .form-shell { padding: 16px; }
            .field { height: 40px; }
            .bottom-wave { min-width: 760px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="container">
            <a href="{% url 'landing' %}" class="logo" aria-label="Confident Moves home">
                <img src="{% static 'design/create_account/Logo_Text 1.svg' %}" alt="Confident Moves">
            </a>
            <div class="layout">
                <section class="form-shell">
                    <h1 class="title-text">Create Your Account</h1>

                    <form id="create-account-form" action="{% url 'create_account' %}" method="post" onsubmit="createAccount(event)">
                        {% csrf_token %}

                        <div class="form-group">
                            <label class="plain-label" for="registration_code">Registration Code</label>
                            <input class="field" type="text" id="registration_code" name="registration_code" required placeholder="Enter registration code">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="username">ID (not case-sensitive)</label>
                            <input class="field" type="text" id="username" name="username" required placeholder="Enter your ID">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="password">Password (case-sensitive)</label>
                            <input class="field" type="password" id="password" name="password" required placeholder="Enter your password">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="password_confirm">Password Confirmation (case-sensitive)</label>
                            <input class="field" type="password" id="password_confirm" name="password_confirm" required placeholder="Confirm your password">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="full_name">Full Name</label>
                            <input class="field" type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="email">Email Address (not case-sensitive)</label>
                            <input class="field" type="email" id="email" name="email" required placeholder="Enter your email address">
                        </div>

                        <div class="form-group">
                            <label class="plain-label" for="phone_number">Phone Number (not case-sensitive)</label>
                            <input class="field" type="tel" id="phone_number" name="phone_number" required placeholder="Enter your phone number">
                        </div>

                        

                        <div class="form-group">
                            <label class="plain-label">Address<span class="plain-label-note">(please enter your address carefully to receive study-related emails from us)</span></label>
                            <input class="field" type="text" id="address_line1" name="address_line1" required placeholder="Enter street address">
                        </div>
                        <div class="form-group">
                            <label class="plain-label" for="city">City</label>
                            <input class="field" type="text" id="city" name="city" required placeholder="Enter city">
                        </div>
                        <div class="form-group">
                            <label class="plain-label" for="state">State</label>
                            <input class="field" type="text" id="state" name="state" required placeholder="Enter state">
                        </div>
                        <div class="form-group">
                            <label class="plain-label" for="zip_code">ZIP Code</label>
                            <input class="field" type="text" id="zip_code" name="zip_code" required placeholder="Enter ZIP code">
                        </div>

                        <div class="actions">
                            <button type="submit" class="submit-btn" aria-label="Submit">
                                <img src="{% static 'design/create_account/Component 1.svg' %}" alt="Submit">
                            </button>
                            <a href="{% url 'login' %}" class="login-link">Already have an account? Login</a>
                        </div>
                    </form>

                    <div id="create-account-output"></div>
                </section>

                <img class="hero-img" src="{% static 'design/create_account/Page Image.svg' %}" alt="Create account page illustration">
            </div>
        </div>

        <img class="bottom-wave" src="{% static 'design/create_account/Bottom.svg' %}" alt="" aria-hidden="true">
    </main>

    <script>
        async function createAccount(event) {
            event.preventDefault();
            const form = document.getElementById('create-account-form');
            const outputDiv = document.getElementById('create-account-output');
            outputDiv.innerHTML = '<div class="alert alert-info">Creating your account...</div>';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCSRFToken(),
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: new FormData(form)
                });

                const result = await response.json();
                if (response.ok && result.status === 'success') {
                    outputDiv.innerHTML = '<div class="alert alert-success">' + result.message + '</div>';
                    setTimeout(() => { window.location.href = result.redirect; }, 1000);
                } else {
                    let errorHtml = '<div class="alert alert-error">Error: ' + (result.message || 'Account creation failed.') + '</div>';
                    if (result.errors) {
                        let errors = '<ul style="margin:0.5rem 0; padding-left:1.2rem;">';
                        for (let field in result.errors) {
                            result.errors[field].forEach(error => {
                                errors += '<li>' + field + ': ' + error + '</li>';
                            });
                        }
                        errors += '</ul>';
                        errorHtml += '<div class="alert alert-error">' + errors + '</div>';
                    }
                    outputDiv.innerHTML = errorHtml;
                }
            } catch (error) {
                outputDiv.innerHTML = '<div class="alert alert-error">An error occurred: ' + error.message + '</div>';
            }
        }

        function getCSRFToken() {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, 'csrftoken'.length + 1) === ('csrftoken' + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring('csrftoken'.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
